- id: '1721600848191'
  alias: Unlock Tesla
  description: ''
  trigger:
  - platform: event
    event_data:
      actionID: 91F83F00-FAB2-4CCD-AC45-26F22A0034AE
    event_type: ios.action_fired
  condition: []
  action:
  - service: lock.unlock
    metadata: {}
    data: {}
    target:
      entity_id: lock.tess_doors
  mode: single
- id: '1728774710779'
  alias: Leave Garage
  description: ''
  trigger:
  - platform: state
    entity_id:
    - binary_sensor.tess_charger
    from:
    to: 'off'
  condition:
  - condition: zone
    entity_id: device_tracker.tess_location_tracker
    zone: zone.home
  action:
  - action: cover.open_cover
    metadata: {}
    data: {}
    target:
      entity_id: cover.right_garage_door_door
  - wait_for_trigger:
    - platform: state
      entity_id:
      - binary_sensor.right_garage_door_obstruction
      from:
      to: 'on'
    continue_on_timeout: false
    timeout:
      hours: 0
      minutes: 2
      seconds: 0
      milliseconds: 0
  - wait_for_trigger:
    - platform: state
      entity_id:
      - binary_sensor.right_garage_door_obstruction
      from:
      to: 'off'
      for:
        hours: 0
        minutes: 0
        seconds: 5
  - action: cover.close_cover
    metadata: {}
    data: {}
    target:
      entity_id: cover.right_garage_door_door
  mode: single
- id: '1728774931715'
  alias: Close Garage Doors after 10 minutes
  description: ''
  trigger:
  - platform: state
    entity_id:
    - cover.left_garage_door_door
    - cover.right_garage_door_door
    from:
    to: open
    for:
      hours: 0
      minutes: 15
      seconds: 0
  condition: []
  action:
  - repeat:
      count: 10
      sequence:
      - action: light.turn_on
        metadata: {}
        data: {}
        target:
          entity_id:
          - light.left_garage_door_light
          - light.right_garage_door_light
      - delay:
          hours: 0
          minutes: 0
          seconds: 0
          milliseconds: 500
      - action: light.turn_off
        metadata: {}
        data: {}
        target:
          entity_id:
          - light.left_garage_door_light
          - light.right_garage_door_light
      - delay:
          hours: 0
          minutes: 0
          seconds: 0
          milliseconds: 500
  - action: cover.close_cover
    metadata: {}
    data: {}
    target:
      entity_id:
      - cover.right_garage_door_door
      - cover.left_garage_door_door
  - action: notify.mobile_app_kodeys_iphone
    data:
      message: Garage doors were closed after being open for 15 minutes
      title: Garage Doors Closed
      data:
        push:
          sound:
            name: default
            critical: 1
            volume: 1
  mode: single
- id: '1728775094174'
  alias: Open Right Garage Door when Returning Home
  description: ''
  triggers:
  - entity_id: device_tracker.tess_location_tracker
    zone: zone.home
    event: enter
    trigger: zone
  conditions:
  - type: is_off
    condition: device
    device_id: 9a7f978dd291d7f737ff9ddf8e675379
    entity_id: 1ddb99020ae0e8fcdd56624195c3024e
    domain: binary_sensor
  actions:
  - delay:
      hours: 0
      minutes: 0
      seconds: 18
      milliseconds: 0
  - action: cover.open_cover
    metadata: {}
    data: {}
    target:
      entity_id: cover.right_garage_door_door
  - wait_for_trigger:
    - entity_id:
      - binary_sensor.right_garage_door_obstruction
      from:
      to: 'on'
      trigger: state
    timeout:
      hours: 0
      minutes: 4
      seconds: 0
      milliseconds: 0
    continue_on_timeout: false
  - wait_for_trigger:
    - entity_id:
      - binary_sensor.right_garage_door_obstruction
      from:
      to: 'off'
      trigger: state
    timeout:
      hours: 0
      minutes: 0
      seconds: 30
      milliseconds: 0
  - wait_for_trigger:
    - type: turned_on
      device_id: 9a7f978dd291d7f737ff9ddf8e675379
      entity_id: 1ddb99020ae0e8fcdd56624195c3024e
      domain: binary_sensor
      trigger: device
    timeout:
      hours: 0
      minutes: 0
      seconds: 30
      milliseconds: 0
    continue_on_timeout: false
  - action: cover.close_cover
    metadata: {}
    data: {}
    target:
      entity_id: cover.right_garage_door_door
  - device_id: 9a7f978dd291d7f737ff9ddf8e675379
    domain: cover
    entity_id: 25d56ecf7bf3e433998c57b6e824375a
    type: open
  mode: single
