- id: '1743272727098'
  alias: Notify when Air/Water Filters Need Changing
  description: ''
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.home_air_filters_status
    - sensor.home_water_filters_status
    for:
      hours: 24
      minutes: 0
      seconds: 0
    below: 20
  conditions: []
  actions:
  - action: persistent_notification.create
    metadata: {}
    data:
      message: Water filters or air filters need replacement soon
      title: Home needs maintenance
  mode: single
- id: '1749598659798'
  alias: Notify for Roblox
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - sensor.roblox_7927218551
    - sensor.roblox_8482849026
    - sensor.roblox_8117071479
    attribute: game_id
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.to_state.attributes.game_id is defined }}

          '
      sequence:
      - data:
          title: Roblox Update
          message: "\U0001F3AE Joined the game: {{ trigger.to_state.attributes.game
            }}\n"
        action: notify.mobile_app_kodeys_iphone
    default:
    - data:
        title: Roblox Update
        message: "\U0001F6D1 Left the game: {{ trigger.from_state.attributes.game
          }}\n"
      action: notify.mobile_app_kodeys_iphone
  mode: single
