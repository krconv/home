appdaemon:
  time_zone: EST
  latitude: 0.0
  longitude: 0.0
  elevation: 0
  production_mode: true
  plugins:
    HASS:
      type: hass
      ha_url: <home_assistant_base_url>
      token: <some_long_lived_access_token>s
      mqtt_host: <mqtt_broker_ip>
      mqtt_port: <mqtt_broker_port>
      mqtt_username: <mqtt_username>
      mqtt_password: <mqtt_password>
      zigbee_base_topics:
        - zigbee2mqtt-a
        - zigbee2mqtt-b
      config_dir: config